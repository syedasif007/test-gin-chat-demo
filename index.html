<label>
  Your name:
  <input id="username" placeholder="sam">
</label>
<button id="connect">Connect</button>

<br><br>

<label>
  Send to:
  <input id="recipient" placeholder="john">
</label>
<input id="message" placeholder="Message">
<button id="send" disabled>Send</button>

<pre id="output"></pre>

<script>
  const output = document.getElementById("output");
  const usernameInput = document.getElementById("username");
  const connectButton = document.getElementById("connect");
  const sendButton = document.getElementById("send");

  let ws;

  connectButton.onclick = () => {
    // Disconnect if already connected or connecting.
    if (ws && (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )) {
      connectButton.disabled = true;
      connectButton.textContent = "Disconnecting...";
      ws.close();
      return;
    }

    const username = usernameInput.value.trim();

    if (!username) {
      output.textContent += "Enter your name first.\n";
      return;
    }

    connectButton.disabled = true;
    connectButton.textContent = "Connecting...";

    const connection = new WebSocket(
      `wss://gin-chat-demo.onrender.com/ws?user=${encodeURIComponent(username)}`
    );
    ws = connection;

    connection.onopen = () => {
      if (ws !== connection) return;

      output.textContent += `Connected as ${username}\n`;
      usernameInput.disabled = true;
      sendButton.disabled = false;
      connectButton.disabled = false;
      connectButton.textContent = "Disconnect";
    };

    connection.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);
        output.textContent += message.type === "error"
          ? `Error: ${message.text}\n`
          : `${message.from} → ${message.to}: ${message.text}\n`;
      } catch {
        output.textContent += `Received: ${event.data}\n`;
      }
    };

    connection.onerror = () => {
      output.textContent += "WebSocket error; check the server and browser console.\n";
    };

    connection.onclose = () => {
      if (ws !== connection) return;

      output.textContent += "Disconnected.\n";
      ws = null;
      usernameInput.disabled = false;
      sendButton.disabled = true;
      connectButton.disabled = false;
      connectButton.textContent = "Connect";
    };
  };

  sendButton.onclick = () => {
    const to = document.getElementById("recipient").value.trim();
    const text = document.getElementById("message").value.trim();

    if (!ws || ws.readyState !== WebSocket.OPEN) {
      output.textContent += "Connect first.\n";
      return;
    }

    if (!to || !text) {
      output.textContent += "Enter a recipient and message.\n";
      return;
    }

    ws.send(JSON.stringify({ to, text }));
    document.getElementById("message").value = "";
  };
</script>
