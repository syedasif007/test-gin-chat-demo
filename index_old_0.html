<!doctype html>
<html>
  <body>
    <label>
      Your name:
      <input id="username" placeholder="e.g. ami">
    </label>

    <br><br>

    <input id="message" placeholder="Type a message">
    <button id="send">Send</button>

    <pre id="output"></pre>

    <script>
      const ws = new WebSocket("ws://localhost:8080/ws");
      const output = document.getElementById("output");

      ws.onopen = () => {
        output.textContent += "Connected\n";
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        output.textContent += `${message.user}: ${message.text}\n`;
      };

      ws.onclose = () => {
        output.textContent += "Disconnected\n";
      };

      document.getElementById("send").onclick = () => {
        const user = document.getElementById("username").value.trim();
        const text = document.getElementById("message").value.trim();

        if (!user || !text) {
          output.textContent += "Enter your name and a message first.\n";
          return;
        }

        ws.send(JSON.stringify({ user, text }));
        document.getElementById("message").value = "";
      };
    </script>
  </body>
</html>
